<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDF1EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C1210" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="장부">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="복식부기 원리로 동작하는 개인 회계장부: 대시보드, 전표, 총계정원장, 재무제표">
<title>개인 회계장부</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: one ledger-book column (max 640px) — a dark cloth "cover" hero over ruled paper pages, bottom tab bar for the thumb. */
:root{
  --paper:#EDF1EA;
  --card:#FBFCFA;
  --ink:#13201A;
  --ink-2:#4A5751;
  --muted:#727E77;
  --rule:#DAE1D8;
  --rule-2:#C2CCC0;
  --accent:#1D6B50;
  --accent-ink:#FFFFFF;
  --accent-soft:#DCEBE2;
  --inc:#2a78d6;
  --exp:#eb6834;
  --good:#0F7A3D; --good-soft:#DDF0E3;
  --bad:#C2372F;  --bad-soft:#FAE2DF;
  --warn:#8F5B00; --warn-soft:#FAEED3;
  --hero:#173A2D; --hero-ink:#F2F5EF; --hero-muted:#A9C1B4; --hero-rule:rgba(255,255,255,.08); --gold:#E5CD87;
  --scrim:rgba(10,20,15,.42);
  --shadow:0 1px 2px rgba(19,32,26,.05),0 4px 14px rgba(19,32,26,.05);
  --f-display:"Gowun Batang","Noto Serif KR","AppleMyungjo","Nanum Myeongjo",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0C1210; --card:#141B17; --ink:#E5ECE7; --ink-2:#B2BEB7; --muted:#8A968F;
    --rule:#232E28; --rule-2:#34423B; --accent:#5BBE94; --accent-ink:#06130D; --accent-soft:#1A3026;
    --inc:#3987e5; --exp:#d95926;
    --good:#4CC47F; --good-soft:#15301F; --bad:#F07B72; --bad-soft:#3A1C19; --warn:#E7AE45; --warn-soft:#372A12;
    --hero:#10271E; --hero-ink:#EEF3EF; --hero-muted:#9BB4A7; --hero-rule:rgba(255,255,255,.06); --gold:#E3C67C;
    --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0C1210; --card:#141B17; --ink:#E5ECE7; --ink-2:#B2BEB7; --muted:#8A968F;
  --rule:#232E28; --rule-2:#34423B; --accent:#5BBE94; --accent-ink:#06130D; --accent-soft:#1A3026;
  --inc:#3987e5; --exp:#d95926;
  --good:#4CC47F; --good-soft:#15301F; --bad:#F07B72; --bad-soft:#3A1C19; --warn:#E7AE45; --warn-soft:#372A12;
  --hero:#10271E; --hero-ink:#EEF3EF; --hero-muted:#9BB4A7; --hero-rule:rgba(255,255,255,.06); --gold:#E3C67C;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.n{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3{text-wrap:balance;margin:0}

.app{max-width:640px;margin:0 auto;padding-bottom:calc(92px + env(safe-area-inset-bottom))}

/* header */
.top{position:sticky;top:0;z-index:30;background:var(--paper);padding:calc(10px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--rule)}
@supports (backdrop-filter:blur(8px)){.top{background:color-mix(in srgb,var(--paper) 86%,transparent);backdrop-filter:saturate(1.3) blur(10px)}}
.brand{display:flex;flex-direction:column;line-height:1.05;margin-right:auto;text-decoration:none}
.brand b{font-family:var(--f-display);font-size:22px;letter-spacing:-.01em}
.brand small{font-family:var(--f-num);font-size:9.5px;letter-spacing:.16em;color:var(--muted);margin-top:3px}
.mon{display:flex;align-items:center;background:var(--card);border:1px solid var(--rule);border-radius:999px;height:36px}
.mon .ib{width:34px;height:34px;border:0;background:none;border-radius:999px;font-size:20px;line-height:1;color:var(--ink-2)}
.mon-l{position:relative;padding:0 2px;font-weight:600;font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.mon-l input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.gear{width:36px;height:36px;border-radius:999px;border:1px solid var(--rule);background:var(--card);display:grid;place-items:center;color:var(--ink-2);text-decoration:none}
.gear[aria-current="page"]{background:var(--ink);color:var(--card);border-color:var(--ink)}

main{padding:14px max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:14px}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom)}
.tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;height:62px}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:62px;text-decoration:none;color:var(--muted);font-size:11px;font-weight:500}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] svg{color:var(--accent)}
.fabw{display:flex;justify-content:center;height:62px;align-items:center}
.fab{width:54px;height:54px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 40%,transparent);display:grid;place-items:center;transform:translateY(-10px)}
.fab svg{width:26px;height:26px}

/* generic blocks */
.card{background:var(--card);border:1px solid var(--rule);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.card.flush{padding:0;overflow:hidden}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.sec-h h2{font-family:var(--f-display);font-size:18px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.sec-h .meta{font-size:12.5px;color:var(--muted)}
.sec-h a,.linkbtn{font-size:13px;color:var(--accent);text-decoration:none;font-weight:600;background:none;border:0;padding:4px 0}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.no{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.plain{background:var(--paper);color:var(--ink-2);border:1px solid var(--rule)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--rule-2);background:var(--card);font-weight:600;font-size:14.5px;text-decoration:none}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--card)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--rule))}
.btn.danger.fill{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.block{width:100%}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.btn.sm{height:34px;padding:0 12px;font-size:13px;border-radius:10px}

/* banner */
.banner{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 25%,transparent);font-size:13.5px}
.banner b{display:block;font-size:14px}
.banner .btn{flex:none;margin-left:auto}
.banner.info{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 25%,transparent)}

/* hero (ledger cover) */
.hero{position:relative;color:var(--hero-ink);background-color:var(--hero);border-radius:18px;padding:18px 18px 14px 26px;overflow:hidden;
  background-image:linear-gradient(90deg,transparent 12px,color-mix(in srgb,var(--gold) 45%,transparent) 12px 13px,transparent 13px 16px,color-mix(in srgb,var(--gold) 45%,transparent) 16px 17px,transparent 17px),
  repeating-linear-gradient(180deg,transparent 0 27px,var(--hero-rule) 27px 28px)}
.hero .lbl{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--hero-muted)}
.hero .lbl b{font-weight:600;color:var(--hero-ink);font-size:13.5px}
.hero .big{font-size:clamp(34px,10.5vw,50px);font-weight:700;letter-spacing:-.02em;line-height:1.1;margin:6px 0 2px;font-feature-settings:"pnum"}
.hero .big .cur{font-size:.5em;font-weight:600;margin-right:4px;color:var(--hero-muted);vertical-align:.32em}
.hero .delta{font-size:13px;color:var(--hero-muted)}
.hero .delta b{color:var(--hero-ink);font-weight:600}
.hero .split{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.14)}
.hero .split div{display:flex;flex-direction:column;min-width:0}
.hero .split span{font-size:11.5px;color:var(--hero-muted)}
.hero .split b{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-feature-settings:"tnum"}
.eq{margin-top:10px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--hero-muted);flex-wrap:wrap}
.eq code{font-family:var(--f-num);font-size:11.5px;color:var(--hero-ink)}
.eq .ok{color:#9BE3B5;font-weight:600}
.eq .no{color:#FFB0A8;font-weight:600}
.spark{display:block;width:100%;height:auto;margin-top:6px;overflow:visible}
.spark .ln{fill:none;stroke:var(--gold);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.spark .ar{fill:var(--gold);opacity:.12}
.spark .dot{fill:var(--gold);stroke:var(--hero);stroke-width:2}
.spark .xl{fill:var(--hero-muted);font-size:10px;font-family:var(--f-body)}
.spark .cross{stroke:var(--hero-muted);stroke-width:1;opacity:0}
.spark .hdot{fill:var(--gold);stroke:var(--hero);stroke-width:2;opacity:0}

/* stat tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .t{font-size:12.5px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.tile .t i{width:8px;height:8px;border-radius:2px;display:inline-block}
.tile .v{font-size:20px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .d{font-size:12px;color:var(--muted)}
.up-good{color:var(--good)} .up-bad{color:var(--bad)}

/* charts */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .grid{stroke:var(--rule);stroke-width:1}
.chart .base{stroke:var(--rule-2);stroke-width:1}
.chart .tick{fill:var(--muted);font-size:10.5px;font-family:var(--f-num)}
.chart .xl{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .xl.on{fill:var(--ink);font-weight:600}
.chart .band{fill:var(--accent-soft);opacity:.7}
.chart .bi{fill:var(--inc)} .chart .be{fill:var(--exp)}
.chart .hit{fill:transparent;cursor:pointer}
.chart .hl{fill:var(--ink);opacity:0}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--ink-2);margin:-2px 0 8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.tip{position:absolute;z-index:5;pointer-events:none;background:var(--ink);color:var(--card);border-radius:10px;padding:8px 10px;font-size:12px;line-height:1.45;min-width:128px;box-shadow:0 6px 18px rgba(0,0,0,.18);opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s}
.tip.on{opacity:1;transform:none}
.tip b{font-weight:600}
.tip .r{display:flex;justify-content:space-between;gap:12px}
.tip .r i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:6px}
.tip .n{font-family:var(--f-num)}
.hero .tip{background:var(--hero-ink);color:var(--hero)}
details.tbl{margin-top:8px}
details.tbl summary{font-size:12.5px;color:var(--muted);cursor:pointer;padding:4px 0;list-style:none}
details.tbl summary::-webkit-details-marker{display:none}
details.tbl summary::before{content:"▸ ";}
details.tbl[open] summary::before{content:"▾ ";}

/* expense composition */
.xlist{display:flex;flex-direction:column;gap:12px}
.xrow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.xrow .nm{font-size:14px;font-weight:500;display:flex;align-items:center;gap:6px;min-width:0}
.xrow .nm span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xrow .val{font-size:13.5px;text-align:right;white-space:nowrap}
.xrow .val small{color:var(--muted);font-size:11.5px;margin-left:4px;font-family:var(--f-body)}
.xbar{grid-column:1/-1;position:relative;height:10px;border-radius:0 4px 4px 0;background:var(--paper)}
.xbar i{position:absolute;left:0;top:0;bottom:0;background:var(--exp);border-radius:0 4px 4px 0;min-width:2px}
.xbar u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);border-radius:1px;opacity:.75}
.xrow .bud{grid-column:1/-1;font-size:11.5px;color:var(--muted);display:flex;gap:6px;align-items:center;margin-top:-1px}

/* ruled lists */
.rl{list-style:none;margin:0;padding:0}
.rl > li{border-top:1px solid var(--rule)}
.rl > li:first-child{border-top:0}
.rrow{display:flex;align-items:center;gap:10px;width:100%;padding:11px 0;background:none;border:0;text-align:left;text-decoration:none;color:inherit}
.rrow .code{font-family:var(--f-num);font-size:11.5px;color:var(--muted);width:36px;flex:none}
.rrow .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .v{font-family:var(--f-num);font-size:14px;white-space:nowrap}
.rrow .chev{color:var(--rule-2);flex:none}
.rrow.dim .nm{color:var(--muted)}
.grp-h{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0 6px;border-bottom:1px solid var(--ink);font-size:13px;font-weight:600}
.grp-h:first-child{padding-top:2px}
.grp-h span:last-child{font-family:var(--f-num)}

/* entry rows */
.erow{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:center;width:100%;padding:11px 0;background:none;border:0;text-align:left;color:inherit}
.ek{font-size:11px;font-weight:600;padding:2px 0;width:40px;text-align:center;border-radius:6px;border:1px solid var(--rule-2);color:var(--ink-2);background:var(--paper)}
.ek.k-expense{border-color:color-mix(in srgb,var(--exp) 45%,var(--rule));color:color-mix(in srgb,var(--exp) 70%,var(--ink))}
.ek.k-income{border-color:color-mix(in srgb,var(--inc) 45%,var(--rule));color:color-mix(in srgb,var(--inc) 70%,var(--ink))}
.em{min-width:0;display:flex;flex-direction:column}
.em .m{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.em .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dc{font-size:10px;font-weight:700;display:inline-block;width:15px;height:15px;line-height:13px;text-align:center;border-radius:4px;border:1px solid currentColor;margin-right:3px;vertical-align:1px}
.ea{font-family:var(--f-num);font-size:14px;text-align:right;white-space:nowrap}
.ea small{display:block;font-family:var(--f-body);font-size:11px;color:var(--muted)}
.dayh{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-2);font-weight:600;padding:12px 0 4px;border-bottom:1px solid var(--rule-2)}
.dayh span:last-child{font-family:var(--f-num);font-weight:500;color:var(--muted)}
.tag-rev{font-size:10.5px;color:var(--bad);font-weight:600;margin-left:4px}

/* filters */
.fbar{display:flex;flex-direction:column;gap:10px}
.search{display:flex;align-items:center;gap:8px;height:42px;padding:0 12px;border-radius:12px;border:1px solid var(--rule);background:var(--card)}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;height:40px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--rule-2);background:var(--card);font-size:13.5px;font-weight:500;color:var(--ink-2);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--card)}
.chip.more{border-style:dashed;color:var(--muted)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:3px;gap:3px}
.seg > *{height:36px;border:0;border-radius:9px;background:none;font-size:13.5px;font-weight:600;color:var(--ink-2);display:grid;place-items:center;text-decoration:none}
.seg > [aria-selected="true"],.seg > [aria-pressed="true"]{background:var(--ink);color:var(--card)}

/* tables (ledger paper) */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -16px;padding:0 16px}
table.lg{width:100%;border-collapse:collapse;font-size:13px}
table.lg th{font-size:11.5px;font-weight:600;color:var(--ink-2);text-align:left;padding:8px 6px;border-bottom:1px solid var(--ink);white-space:nowrap}
table.lg td{padding:9px 6px;border-bottom:1px solid var(--rule);vertical-align:top}
table.lg .n{text-align:right;white-space:nowrap;font-size:12.5px}
table.lg th.n{font-family:var(--f-body)}
table.lg tr.clk{cursor:pointer}
table.lg tr.clk:active td{background:var(--paper)}
table.lg td small{display:block;color:var(--muted);font-size:11px;margin-top:1px}
table.lg tr.tot td{border-top:1px solid var(--ink);border-bottom:3px double var(--ink);font-weight:600}
table.lg tr.carry td{color:var(--ink-2);font-style:normal;background:color-mix(in srgb,var(--paper) 60%,transparent)}
table.lg td:first-child,table.lg th:first-child{padding-left:0}
table.lg td:last-child,table.lg th:last-child{padding-right:0}
table.fs{width:100%;border-collapse:collapse;font-size:14px}
table.fs th{text-align:left;font-family:var(--f-display);font-size:15.5px;padding:16px 0 6px;border-bottom:1px solid var(--ink)}
table.fs td{padding:9px 0;border-bottom:1px solid var(--rule)}
table.fs td.n{text-align:right;font-size:13.5px;white-space:nowrap}
table.fs td small{color:var(--muted);font-family:var(--f-num);font-size:11px;margin-left:6px}
table.fs tr.sub td{font-weight:600;border-bottom:1px solid var(--ink-2)}
table.fs tr.tot td{font-weight:700;border-top:1px solid var(--ink);border-bottom:3px double var(--ink);padding:11px 0}
table.fs tr.ind td:first-child{padding-left:12px}
table.tb{min-width:540px}
@media (min-width:600px){.tb-hint{display:none}}
table.tb td.nm{text-align:center;font-weight:500;white-space:nowrap}
table.tb th{text-align:center}
.fs-h{text-align:center;padding:4px 0 2px}
.fs-h h2{font-family:var(--f-display);font-size:22px;letter-spacing:.18em;margin-right:-.18em}
.fs-h p{margin:4px 0 0;color:var(--muted);font-size:12.5px}
.chk{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px;font-size:12.5px;color:var(--ink-2)}

/* account ledger header */
.ah{display:flex;flex-direction:column;gap:4px}
.ah .top-l{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.ah h2{font-family:var(--f-display);font-size:24px}
.ah .bal{font-size:28px;font-weight:700;letter-spacing:-.01em}
.back{display:inline-flex;align-items:center;gap:4px;font-size:13.5px;color:var(--ink-2);text-decoration:none;font-weight:500}

/* sheets */
#sheet,#dlg{position:fixed;inset:0;z-index:50}
#dlg{z-index:60}
#sheet[hidden],#dlg[hidden]{display:none}
.scrim{position:absolute;inset:0;background:var(--scrim);animation:fade .18s ease-out}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:640px;max-height:94vh;max-height:94dvh;background:var(--card);border-radius:20px 20px 0 0;display:flex;flex-direction:column;animation:up .24s cubic-bezier(.2,.8,.2,1);box-shadow:0 -8px 30px rgba(0,0,0,.2)}
.sh-h{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--rule)}
.sh-h h3{font-family:var(--f-display);font-size:19px;margin-right:auto}
.x{width:36px;height:36px;border-radius:999px;border:1px solid var(--rule);background:var(--paper);display:grid;place-items:center;font-size:18px;color:var(--ink-2)}
.sh-b{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px 18px;display:flex;flex-direction:column;gap:16px;overscroll-behavior:contain}
.sh-f{padding:10px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--rule);display:flex;flex-direction:column;gap:8px;background:var(--card)}
.sh-f .row{display:flex;gap:8px}
.sh-f .row .btn{flex:1}
.err{font-size:12.5px;color:var(--bad);min-height:0}
.dialog{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,400px);background:var(--card);border-radius:18px;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.3);animation:pop .18s ease-out}
.dialog h3{font-family:var(--f-display);font-size:19px;margin-bottom:8px}
.dialog p{margin:0 0 16px;color:var(--ink-2);font-size:14px}
.dialog .row{display:flex;gap:8px}
.dialog .row .btn{flex:1}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translate(-50%,-46%)}}

/* forms */
.fld{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--ink-2);font-weight:500;min-width:0}
.fld input,.fld select,.inp{height:44px;border-radius:12px;border:1px solid var(--rule-2);background:var(--paper);padding:0 12px;font-size:15px;color:var(--ink);width:100%;min-width:0}
.fld input:focus,.fld select:focus,.inp:focus{outline:2px solid var(--accent);outline-offset:-1px;background:var(--card)}
.row2{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:10px}
.amt{display:flex;align-items:baseline;gap:8px;border-bottom:2px solid var(--ink);padding:4px 2px 6px}
.amt .c{font-size:20px;font-weight:600;color:var(--muted)}
.amt input{border:0;background:none;outline:none;font-size:34px;font-weight:700;width:100%;min-width:0;letter-spacing:-.01em;padding:0;font-feature-settings:"tnum"}
.amt input::placeholder{color:var(--rule-2)}
.pick h4{margin:0 0 8px;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:8px}
.pick h4 small{font-weight:500;color:var(--muted);font-size:11.5px}
.side{font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:5px;border:1px solid var(--rule-2);color:var(--ink-2)}

/* voucher */
.vch{border:1.5px solid var(--ink);border-radius:4px;background:var(--card)}
.vch .vh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border-bottom:1.5px solid var(--ink);font-size:12.5px}
.vch .vh b{font-family:var(--f-display);font-size:15px;letter-spacing:.06em}
.vch .vno{font-family:var(--f-num);font-size:12px;color:var(--ink-2)}
.vch .vm{padding:8px 10px;border-bottom:1px solid var(--rule);font-size:13px;color:var(--ink-2);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.vt{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13px}
.vt th{font-size:11.5px;font-weight:700;padding:6px 8px;border-bottom:1px solid var(--ink);text-align:left;letter-spacing:.2em}
.vt th + th{border-left:1px solid var(--ink)}
.vt td{padding:7px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.vt td.ac{width:auto}
.vt td.am{text-align:right;font-family:var(--f-num);font-size:12.5px;white-space:nowrap}
.vt td.cs{border-left:1px solid var(--ink)}
.vt td small{display:block;font-size:10.5px;color:var(--muted)}
.vt tfoot td{border-top:1px solid var(--ink);border-bottom:0;font-weight:600}
.vt tfoot td.am{border-bottom:3px double var(--ink)}

/* journal lines */
.jl{display:flex;flex-direction:column;gap:10px}
.jline{display:grid;grid-template-columns:1fr 34px;gap:6px;padding:10px;border:1px solid var(--rule);border-radius:12px;background:var(--paper)}
.jline select{height:40px;border-radius:10px;border:1px solid var(--rule-2);background:var(--card);padding:0 8px;font-size:14px;min-width:0;width:100%}
.jline .amts{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.jline .amts label{display:flex;align-items:center;gap:6px;height:40px;border-radius:10px;border:1px solid var(--rule-2);background:var(--card);padding:0 10px}
.jline .amts label span{font-size:11px;font-weight:700;color:var(--muted);flex:none}
.jline .amts input{border:0;background:none;outline:none;width:100%;min-width:0;text-align:right;font-family:var(--f-num);font-size:14px}
.jline .rm{width:34px;height:40px;border-radius:10px;border:1px solid var(--rule);background:var(--card);color:var(--muted)}
.jline .el{grid-column:1/-1;font-size:11.5px;color:var(--muted);margin-top:-2px}
.jtot{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px}
.jtot div{display:flex;flex-direction:column;padding:8px 10px;border-radius:10px;border:1px solid var(--rule)}
.jtot div span{font-size:11.5px;color:var(--muted)}
.jtot div b{font-family:var(--f-num);font-weight:600}

/* learn */
.learn{font-size:14px;color:var(--ink-2)}
.learn p{margin:0 0 10px}
.learn table{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0 12px}
.learn th,.learn td{border:1px solid var(--rule-2);padding:6px 8px;text-align:center}
.learn th{background:var(--paper);font-weight:600}
.learn code{font-family:var(--f-num);font-size:12.5px;background:var(--paper);padding:1px 5px;border-radius:5px;color:var(--ink)}
details.box > summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
details.box > summary::-webkit-details-marker{display:none}
details.box > summary::after{content:"＋";color:var(--muted)}
details.box[open] > summary::after{content:"－"}
details.box[open] > summary{margin-bottom:10px}

/* misc */
.empty{text-align:center;padding:26px 10px;color:var(--muted);font-size:14px}
.skel{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--rule) 0%,var(--paper) 50%,var(--rule) 100%);background-size:200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:12px;font-size:13.5px;z-index:70;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right}
.stack{display:flex;flex-direction:column;gap:10px}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px}
.toggle input{width:22px;height:22px;accent-color:var(--accent)}
.orow{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px}
.orow .inp{max-width:170px;text-align:right;height:40px}

@media (min-width:560px){
  .tiles{grid-template-columns:repeat(4,1fr)}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
}

<script>
'use strict';
/* =========================================================
   개인 회계장부 — 복식부기(double-entry) 개인 총계정원장

   ========================================================= */

let IN_CLAUDE = !!(window.claude && typeof window.claude.use === 'function');

/* ---------- 회계 기준 정보 ---------- */
const TYPES = {
  A:{name:'자산', side:'D', up:'자산의 증가', down:'자산의 감소', lo:1000, hi:1999},

  ['1010','현금','A'],['1020','보통예금','A'],['1030','적금·정기예금','A'],['1040','증권계좌','A'],['1050','연금·저축보험','A'],

  ['2010','신용카드','L'],['2020','대출금','L'],['2030','빌린 돈','L'],['2040','미지급금','L'],
  ['3010','기초순자산','E'],
  ['4010','급여','R'],['4020','상여·성과급','R'],['4030','부수입','R'],['4110','이자수익','R'],['4120','배당·투자수익','R'],['4900','기타수익','R'],
  ['5010','식비','X'],['5020','카페·간식','X'],['5030','주거·관리비','X'],['5040','공과금·통신','X'],['5050','교통·차량','X'],

  ['5110','보험료','X'],['5120','이자비용','X'],['5130','세금','X'],['5900','기타비용','X'],
].map(([code,name,type]) => ({code, name, type, active:true, budget:0}));
const CUR = {
  KRW:{sym:'₩', dec:0, label:'원 (KRW)'},
  SAR:{sym:'SAR', dec:2, label:'사우디 리얄 (SAR)'},
  USD:{sym:'$', dec:2, label:'미국 달러 (USD)'},
  EUR:{sym:'€', dec:2, label:'유로 (EUR)'},
  JPY:{sym:'¥', dec:0, label:'엔 (JPY)'},
};
const KIND = {expense:'지출', income:'수입', transfer:'이체', journal:'분개', opening:'기초', reversal:'역분개'};
const DOW = ['일','월','화','수','목','금','토'];

/* ---------- 유틸 ---------- */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = (n, w=2) => String(n).padStart(w, '0');
const clone = o => JSON.parse(JSON.stringify(o));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const ymOf = iso => iso.slice(0, 7);
function addMonths(ym, k){ let [y, m] = ym.split('-').map(Number); m += k; while(m > 12){m -= 12; y++;} while(m < 1){m += 12; y--;} return `${y}-${pad(m)}`; }
function monthEnd(ym){ const [y, m] = ym.split('-').map(Number); return `${ym}-${pad(new Date(y, m, 0).getDate())}`; }
function dayBefore(iso){ const [y,m,d] = iso.split('-').map(Number); const t = new Date(y, m-1, d-1); return `${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(t.getDate())}`; }
function dowOf(iso){ const [y,m,d] = iso.split('-').map(Number); return DOW[new Date(y, m-1, d).getDay()]; }
const ymLabel = ym => `${ym.slice(0,4)}년 ${Number(ym.slice(5))}월`;
const ymShort = ym => `${Number(ym.slice(5))}월`;
const dLabel = iso => `${Number(iso.slice(5,7))}월 ${Number(iso.slice(8))}일 (${dowOf(iso)})`;
const dFull = iso => `${iso.slice(0,4)}년 ${Number(iso.slice(5,7))}월 ${Number(iso.slice(8))}일`;
const dDot = iso => `${iso.slice(0,4)}.${iso.slice(5,7)}.${iso.slice(8)}`;

/* 금액은 모두 1/100 단위 정수(cents)로 저장 — 부동소수점 오차 없음 */
function cur(){ return CUR[(book() && book().currency) || 'KRW'] || CUR.KRW; }
const NF = {};
function nf(dec){ return NF[dec] || (NF[dec] = new Intl.NumberFormat('ko-KR', {minimumFractionDigits:dec, maximumFractionDigits:dec})); }
function fmt(c, o={}){
  const k = cur(); const s = nf(k.dec).format(Math.abs(c) / 100);
  let out = (o.sym ? k.sym + (k.sym.length > 1 ? ' ' : '') : '') + s;
  if (c < 0) out = (o.tri ? '△' : '−') + out;
  else if (o.sign && c > 0) out = '+' + out;
  return out;
}
function compact(c){
  const v = Math.abs(c) / 100, neg = c < 0 ? '−' : '';
  const trim = x => String(+x.toFixed(x >= 100 ? 0 : 1));
  if (cur() === CUR.KRW){
    if (v >= 1e8) return neg + trim(v/1e8) + '억';
    if (v >= 1e4) return neg + trim(v/1e4) + '만';
    return neg + nf(0).format(v);
  }
  if (v >= 1e6) return neg + trim(v/1e6) + 'M';
  if (v >= 1e3) return neg + trim(v/1e3) + 'K';
  return neg + nf(0).format(v);
}
function parseAmt(s){ const v = parseFloat(String(s || '').replace(/[^\d.]/g, '')); return isFinite(v) ? Math.round(v * 100) : 0; }
function amtInputStr(c){ if (!c) return ''; const k = cur(); const v = c / 100; return k.dec ? v.toLocaleString('en-US', {minimumFractionDigits:0, maximumFractionDigits:k.dec}) : Math.round(v).toLocaleString('en-US'); }
function liveFormat(el){
  const k = cur(); let s = el.value.replace(/[^\d.]/g, '');
  if (!k.dec) s = s.replace(/\./g, '');
  else { const i = s.indexOf('.'); if (i >= 0) s = s.slice(0, i+1) + s.slice(i+1).replace(/\./g, '').slice(0, k.dec); }
  let [ip, fp] = s.split('.'); ip = (ip || '').replace(/^0+(?=\d)/, '').slice(0, 13);
  const f = ip ? Number(ip).toLocaleString('en-US') : '';
  el.value = fp !== undefined ? (f || '0') + '.' + fp : f;
}
function lsGet(k){ try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch { return null; } }
function lsSet(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } }

/* ---------- 상태 ---------- */
const LS_BOOK = 'pgl.book.v1', LS_PREF = 'pgl.prefs.v1';
const P = Object.assign({last:{}, lastBackup:0}, lsGet(LS_PREF) || {});
const savePrefs = () => lsSet(LS_PREF, P);
const S = {
  mode:'loading',          // loading | demo | live
  storage:null,            // cloud | local
  view:'dashboard', acct:null, rtab:'bs', isRange:'month',
  month: ymOf(todayISO()),
  jkind:'all', jq:'',
  note:'',                 // slow | error | nosave
  rev:0,
};
const REAL = {book:null, months:{}};
let DEMO = null;
const data = () => S.mode === 'demo' ? DEMO : REAL;
const book = () => data() && data().book;

let _am = {b:null, m:{}};
function amap(){ const b = book(); if (_am.b !== b){ _am = {b, m:Object.fromEntries((b ? b.accounts : []).map(a => [a.code, a]))}; } return _am.m; }
const typeOf = code => (amap()[code] && amap()[code].type) || ({1:'A',2:'L',3:'E',4:'R',5:'X'})[String(code)[0]] || 'X';
const aname = code => (amap()[code] && amap()[code].name) || `(${code})`;
const accountsOf = (t, all=false) => (book() ? book().accounts : []).filter(a => a.type === t && (all || a.active)).sort((a,b) => a.code.localeCompare(b.code));

/* ---------- 회계 엔진 ---------- */
let _ec = {key:null, list:[]};
function entries(){
  const d = data(); const key = S.mode + ':' + S.rev;
  if (_ec.key !== key){
    const out = [];
    if (d) for (const mk in d.months){ const items = d.months[mk] || {}; for (const id in items){ const e = items[id]; if (e && Array.isArray(e.lines)) out.push(e); } }
    out.sort((a,b) => a.date < b.date ? -1 : a.date > b.date ? 1 : (a.no || '') < (b.no || '') ? -1 : (a.no || '') > (b.no || '') ? 1 : 0);
    _ec = {key, list:out};
  }
  return _ec.list;
}
/** 기간 내 계정별 차변·대변 합계 (from/to 포함, null이면 제한 없음) */
function sums(list, from, to){
  const m = {};
  for (const e of list){
    if (from && e.date < from) continue;
    if (to && e.date > to) continue;
    for (const l of e.lines){ const r = m[l.a] || (m[l.a] = {d:0, c:0}); r.d += l.d || 0; r.c += l.c || 0; }
  }
  return m;
}
/** 정상잔액 방향 기준 잔액: 자산·비용은 차변-대변, 부채·자본·수익은 대변-차변 */
function balOf(code, sm){ const r = sm[code]; if (!r) return 0; return TYPES[typeOf(code)].side === 'D' ? r.d - r.c : r.c - r.d; }
function typeTotal(t, sm){ let s = 0; for (const code in sm) if (typeOf(code) === t) s += balOf(code, sm); return s; }
function position(asOf){
  const sm = sums(entries(), null, asOf);
  const A = typeTotal('A', sm), L = typeTotal('L', sm), E = typeTotal('E', sm), R = typeTotal('R', sm), X = typeTotal('X', sm);
  return {sm, A, L, E, NI:R - X, equity:E + R - X, net:A - L};
}
function flow(from, to){
  const sm = sums(entries(), from, to);
  return {sm, R:typeTotal('R', sm), X:typeTotal('X', sm)};
}
const monthFlow = ym => flow(ym + '-01', monthEnd(ym));
function validateLines(lines){
  if (lines.length < 2) return '분개는 최소 두 줄(차변·대변)이 필요해요.';
  let d = 0, c = 0;
  for (const l of lines){
    if (!l.a) return '모든 줄에 계정과목을 선택하세요.';
    if (l.d < 0 || l.c < 0) return '음수 금액은 쓸 수 없어요. 반대편(차변↔대변)에 입력하세요.';

const Store = {
  kind:null, db:null, bookRef:null, col:null, cloudMonths:new Set(), q:{},
  run(key, fn){ const prev = this.q[key] || Promise.resolve(); const p = prev.catch(() => {}).then(fn); this.q[key] = p.catch(() => {}); return p; },
  saveLocal(){
    const ok = lsSet(LS_BOOK, {v:1, book:REAL.book, months:REAL.months});
    if (!ok && S.note !== 'nosave'){ S.note = 'nosave'; render(); }
    return Promise.resolve();
  },
  saveBook(){
    if (this.kind === 'cloud') return this.run('book', () => this.bookRef.set(clone(REAL.book)));
    return this.saveLocal();
  },
  putEntry(e){
    if (this.kind !== 'cloud') return this.saveLocal();
    const mk = ymOf(e.date);
    return this.run('m:' + mk, async () => {
      const ref = this.col.doc(mk);
      if (this.cloudMonths.has(mk)) { await ref.update({items:{[e.id]:clone(e)}}); return; }
      try { await ref.update({items:{[e.id]:clone(e)}}); }
      catch (err) { if (err && err.code === 'invalid_argument') await ref.set({items:{[e.id]:clone(e)}}); else throw err; }
    });
  },
  removeEntry(mk, id){
    if (this.kind !== 'cloud') return this.saveLocal();
    return this.run('m:' + mk, async () => {
      const ref = this.col.doc(mk);
      try { await ref.update({items:{[id]:null}}); }   // 다른 기기의 같은 달 전표를 건드리지 않는 병합 삭제
      catch (err) {
        if (!(err && err.code === 'invalid_argument')) throw err;
        if (this.cloudMonths.has(mk)) await ref.set({items:clone(REAL.months[mk] || {})});
      }
    });
  },
  async replaceAll(){
    if (this.kind !== 'cloud') return this.saveLocal();
    const keep = new Set(Object.keys(REAL.months));
    for (const mk of [...this.cloudMonths]) if (!keep.has(mk)) await this.run('m:' + mk, () => this.col.doc(mk).delete());
    for (const mk of keep) await this.run('m:' + mk, () => this.col.doc(mk).set({items:clone(REAL.months[mk])}));
    await this.saveBook();
  },
  async wipe(){
    if (this.kind !== 'cloud'){ try { localStorage.removeItem(LS_BOOK); } catch {} return; }
    for (const mk of [...this.cloudMonths]) await this.run('m:' + mk, () => this.col.doc(mk).delete());
    await this.run('book', () => this.bookRef.delete());
  },
};
function onStoreError(err){

    : code === 'revoked' || code === 'not_granted' ? '저장 권한이 없어졌어요. 페이지를 다시 열어 주세요.'
    : '저장하지 못했어요. 연결을 확인하고 다시 시도해 주세요.';
  toast(msg, 4200);
}
function normalizeBook(b){
  b = b && typeof b === 'object' ? b : {};
  if (!CUR[b.currency]) b.currency = 'KRW';
  if (!Array.isArray(b.accounts) || !b.accounts.length) b.accounts = clone(DEFAULT_ACCOUNTS);

function chartW(inner){ const vw = Math.min(document.documentElement.clientWidth || 390, 640); return Math.max(260, vw - 32 - inner); }
function expenseCard(ym, f){

  const total = f.X;

    return r.other ? `<div class="xrow">${inner}</div>` : `<a class="xrow" href="#ledger-${r.a.code}" style="text-decoration:none;color:inherit">${inner}</a>`;
  }).join('') : '<div class="empty">이번 달 지출 기록이 없어요.</div>';
  return `<section class="card">

/* ----- 차트 ----- */
function niceTicks(max, n){
  const raw = max / n; const mag = Math.pow(10, Math.floor(Math.log10(raw || 1)));
  const step = [1, 2, 2.5, 5, 10].map(s => s * mag).find(s => s >= raw) || 10 * mag;
  const out = []; for (let v = 0; v <= max + step * .001 || out.length < 2; v += step) out.push(v);
  if (out[out.length - 1] < max) out.push(out[out.length - 1] + step);
  return out;
}
const CH = {};
function colPath(x, y, w, h, r){ if (h <= 0.5) return ''; r = Math.min(r, h, w / 2); return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`; }
function colChart(rows, W){
  const H = 196, pl = 44, pr = 4, pt = 8, pb = 26, iw = W - pl - pr, ih = H - pt - pb;
  const max = Math.max(1, ...rows.flatMap(r => [r.inc, r.exp]));
  const ticks = niceTicks(max, 4), top = ticks[ticks.length - 1];
  const y = v => pt + ih - Math.max(0, v) / top * ih;
  const gw = iw / rows.length, bw = Math.max(5, Math.min(20, (gw - 16) / 2));
  CH.cols = {rows, gw, pl, pt, ih};
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="최근 6개월 월별 수입과 지출 막대 그래프">`;
  rows.forEach((r, i) => { if (r.ym === S.month) s += `<rect class="band" x="${pl + gw * i + 3}" y="${pt}" width="${gw - 6}" height="${ih}" rx="8"/>`; });
  ticks.forEach(t => { s += `<line class="grid" x1="${pl}" x2="${W - pr}" y1="${y(t)}" y2="${y(t)}"/><text class="tick" x="${pl - 6}" y="${y(t) + 3.5}" text-anchor="end">${t === 0 ? '0' : compact(t)}</text>`; });
  rows.forEach((r, i) => {
    const cx = pl + gw * i + gw / 2;
    s += `<path class="bi" d="${colPath(cx - 1 - bw, y(r.inc), bw, y(0) - y(r.inc), 4)}"/>`;
    s += `<path class="be" d="${colPath(cx + 1, y(r.exp), bw, y(0) - y(r.exp), 4)}"/>`;
    s += `<text class="xl ${r.ym === S.month ? 'on' : ''}" x="${cx}" y="${H - 7}" text-anchor="middle">${ymShort(r.ym)}</text>`;
  });
  s += `<line class="base" x1="${pl}" x2="${W - pr}" y1="${y(0)}" y2="${y(0)}"/>`;
  rows.forEach((r, i) => { s += `<rect class="hit" data-i="${i}" x="${pl + gw * i}" y="0" width="${gw}" height="${H}"/>`; });
  return s + '</svg>';
}
function spark(pts, W){
  const H = 74, pt = 8, pb = 18, pl = 2, pr = 8, ih = H - pt - pb, iw = W - pl - pr;
  const vals = pts.map(p => p.v); let lo = Math.min(...vals), hi = Math.max(...vals);
  if (hi === lo){ hi += 1; lo -= 1; } const padv = (hi - lo) * .12; lo -= padv; hi += padv;
  const x = i => pl + (pts.length === 1 ? iw / 2 : i / (pts.length - 1) * iw), y = v => pt + ih - (v - lo) / (hi - lo) * ih;
  CH.nw = {pts, x, y, W, H};
  const d = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join('');
  const area = `${d}L${x(pts.length - 1).toFixed(1)},${pt + ih}L${x(0).toFixed(1)},${pt + ih}Z`;
  const li = pts.length - 1;
  let s = `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="월말 순자산 추이">`;
  s += `<path class="ar" d="${area}"/><path class="ln" d="${d}"/>`;
  s += `<line class="cross" x1="0" x2="0" y1="${pt}" y2="${pt + ih}"/><circle class="hdot" r="4" cx="0" cy="0"/>`;
  s += `<circle class="dot" r="4" cx="${x(li)}" cy="${y(pts[li].v)}"/>`;
  s += `<text class="xl" x="${x(0)}" y="${H - 3}">${ymShort(pts[0].ym)}</text><text class="xl" x="${x(li)}" y="${H - 3}" text-anchor="end">${ymShort(pts[li].ym)}</text>`;
  const step = pts.length > 1 ? iw / (pts.length - 1) : iw;
  pts.forEach((p, i) => { s += `<rect class="hit" data-i="${i}" x="${x(i) - step / 2}" y="0" width="${step}" height="${H}" fill="transparent"/>`; });
  return s + '</svg>';
}
function showTip(chartEl, i){
  const kind = chartEl.dataset.chart, tip = chartEl.querySelector('.tip'), svg = chartEl.querySelector('svg');
  if (!tip || !svg) return;
  const sc = svg.getBoundingClientRect().width / svg.viewBox.baseVal.width;
  let html = '', ax = 0, ay = 0;
  if (kind === 'cols'){
    const c = CH.cols; const r = c.rows[i]; if (!r) return;
    html = `<b>${ymLabel(r.ym)}</b><div class="r"><span><i style="background:var(--inc)"></i>수입</span><span class="n">${fmt(r.inc)}</span></div><div class="r"><span><i style="background:var(--exp)"></i>지출</span><span class="n">${fmt(r.exp)}</span></div><div class="r"><span>순이익</span><span class="n">${fmt(r.inc - r.exp)}</span></div>`;
    ax = (c.pl + c.gw * i + c.gw / 2) * sc; ay = c.pt * sc;
    svg.querySelectorAll('.xl').forEach((t, k) => t.classList.toggle('on', k === i || c.rows[k].ym === S.month));
  } else {
    const c = CH.nw; const p = c.pts[i]; if (!p) return;
    html = `<b>${ymLabel(p.ym)} 말</b><div class="r"><span>순자산</span><span class="n">${fmt(p.v)}</span></div>`;
    ax = c.x(i) * sc; ay = c.y(p.v) * sc;
    const cr = svg.querySelector('.cross'), hd = svg.querySelector('.hdot');
    cr.setAttribute('x1', c.x(i)); cr.setAttribute('x2', c.x(i)); cr.style.opacity = .6;
    hd.setAttribute('cx', c.x(i)); hd.setAttribute('cy', c.y(p.v)); hd.style.opacity = 1;
  }
  tip.innerHTML = html; tip.classList.add('on');
  const tw = tip.offsetWidth, cw = chartEl.clientWidth;
  let left = ax - tw / 2; left = Math.max(0, Math.min(cw - tw, left));
  tip.style.left = left + 'px';
  tip.style.top = Math.max(-10, ay - tip.offsetHeight - 10) + 'px';
}
function hideTip(chartEl){
  const tip = chartEl.querySelector('.tip'); if (tip) tip.classList.remove('on');
  const cr = chartEl.querySelector('.cross'), hd = chartEl.querySelector('.hdot');
  if (cr) cr.style.opacity = 0; if (hd) hd.style.opacity = 0;
  if (chartEl.dataset.chart === 'cols' && CH.cols) chartEl.querySelectorAll('.xl').forEach((t, k) => t.classList.toggle('on', CH.cols.rows[k] && CH.cols.rows[k].ym === S.month));
}

  } else {
    if (!/^\d{4}$/.test(codeIn)) return err('계정코드는 숫자 4자리예요.');
    const n = +codeIn; if (n < TYPES[t].lo || n > TYPES[t].hi) return err(`${TYPES[t].name} 계정코드는 ${TYPES[t].lo}~${TYPES[t].hi} 사이예요.`);
    if (amap()[codeIn]) return err('이미 있는 계정코드예요.');
    accs.push({code:codeIn, name, type:t, active:true, budget:t === 'X' ? budget : 0});
  }
  REAL.book = {...REAL.book, accounts:accs}; S.rev++; closeSheet(); render();
  Store.saveBook().catch(onStoreError); toast('계정과목을 저장했어요');
}
function delAcct(){
  const code = AE.code; if (entries().some(e => e.lines.some(l => l.a === code))) return;
  dialog({title:'계정을 삭제할까요?', msg:`${esc(aname(code))} (${code}) 계정을 계정과목표에서 지워요.`, ok:'삭제', danger:true, onOk:() => {
    REAL.book = {...REAL.book, accounts:REAL.book.accounts.filter(a => a.code !== code)}; S.rev++; closeSheet();
    if (S.view === 'ledger' && S.acct === code) location.hash = '#ledger'; else render();
    Store.saveBook().catch(onStoreError); toast('계정을 삭제했어요');
  }});
}

/* ----- 장부 시작 ----- */
let START_CUR = 'KRW';

/* ----- 백업 ----- */
async function saveFile(filename, text, mime){
  if (IN_CLAUDE){
    let dl = null; try { dl = await window.claude.use('downloads'); } catch {}
    if (dl){ try { await dl.save({filename, data:text}); return true; } catch { toast('파일 저장이 취소됐어요'); return false; } }
    try { await navigator.clipboard.writeText(text); toast('파일 저장 대신 클립보드에 복사했어요', 3200); return true; } catch { toast('이 화면에서는 파일을 저장할 수 없어요'); return false; }
  }
  const blob = new Blob([text], {type:mime}); const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500); return true;
}
async function exportJSON(){
  const payload = {app:'personal-ledger', version:1, exportedAt:new Date().toISOString(), book:book(), entries:entries()};
  const ok = await saveFile(`장부백업_${todayISO()}.json`, JSON.stringify(payload, null, 1), 'application/json');
  if (ok && S.mode === 'live'){ P.lastBackup = Date.now(); savePrefs(); render(); if (!IN_CLAUDE) toast('백업 파일을 저장했어요'); }
}
async function exportCSV(){
  const q = v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const dec = cur().dec; const num = c => c ? (c / 100).toFixed(dec) : '';
  const rows = [['전표번호','전표일자','구분','적요','계정코드','계정과목','계정구분','차변','대변']];
  for (const e of entries()) for (const l of e.lines) rows.push([e.no, e.date, KIND[e.kind] || '분개', e.memo, l.a, aname(l.a), TYPES[typeOf(l.a)].name, num(l.d), num(l.c)]);
  const ok = await saveFile(`분개장_${todayISO()}.csv`, '﻿' + rows.map(r => r.map(q).join(',')).join('\r\n'), 'text/csv');
  if (ok && !IN_CLAUDE) toast('CSV 파일을 저장했어요');
}
function importFile(file){
  const rd = new FileReader();
  rd.onload = () => {
    let p; try { p = JSON.parse(rd.result); } catch { return toast('JSON 파일을 읽을 수 없어요'); }
    if (!p || p.app !== 'personal-ledger' || !p.book || !Array.isArray(p.entries)) return toast('이 장부의 백업 파일이 아니에요');
    const nb = normalizeBook(clone(p.book)); delete nb.demo;
    const months = {}; let bad = 0;
    for (const e of p.entries){
      if (!e || typeof e.date !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(e.date) || !Array.isArray(e.lines)){ bad++; continue; }
      const lines = e.lines.map(l => ({a:String(l.a), d:Math.max(0, Math.round(+l.d || 0)), c:Math.max(0, Math.round(+l.c || 0))}));
      if (validateLines(lines)){ bad++; continue; }
      const x = {id:String(e.id || uid()), no:String(e.no || ''), date:e.date, memo:String(e.memo || '').slice(0, 60), kind:KIND[e.kind] ? e.kind : 'journal', lines, ref:e.ref || null, revBy:e.revBy || null, ts:+e.ts || Date.now(), upd:+e.upd || null};
      (months[ymOf(x.date)] || (months[ymOf(x.date)] = {}))[x.id] = x;
    }
    const n = p.entries.length - bad;
    dialog({title:'백업을 불러올까요?', msg:`전표 ${n.toLocaleString()}건${bad ? ` (차대 불일치 등 ${bad}건 제외)` : ''}과 계정과목 ${nb.accounts.length}개로 현재 장부를 바꿔요. 지금 장부의 내용은 사라져요.`, ok:'불러오기', danger:true, onOk:async () => {
      REAL.book = nb; REAL.months = months; S.mode = 'live'; S.rev++; render();
      try { await Store.replaceAll(); toast(`전표 ${n.toLocaleString()}건을 불러왔어요`); } catch (e) { onStoreError(e); }
    }});
  };
  rd.readAsText(file);
}
function wipeAll(){
  dialog({title:'장부를 모두 지울까요?', msg:`전표 ${entries().length.toLocaleString()}건과 계정과목, 기초잔액이 모두 삭제돼요. 되돌릴 수 없어요.`, ok:'전체 삭제', danger:true, onOk:async () => {
    REAL.book = null; REAL.months = {}; enterDemo(); location.hash = '#dashboard'; render();
    try { await Store.wipe(); toast('장부를 삭제했어요'); } catch (e) { onStoreError(e); }
  }});
}

/* ---------- 이벤트 ---------- */
const ACT = {
  new: () => openEntry(P.lastMode || 'expense'),
  start: () => openStart(),
  'start-cur': t => { START_CUR = t.dataset.k; document.querySelectorAll('[data-act="start-cur"]').forEach(b => b.setAttribute('aria-pressed', b.dataset.k === START_CUR)); },
  'start-go': () => createBook(),
  close: () => closeSheet(),
  'dlg-no': () => closeDlg(),
  'dlg-ok': () => { const f = DLG; closeDlg(); if (f) f(); },
  mon: t => { S.month = addMonths(S.month, +t.dataset.k); render(); },
  'mon-pick': () => { const i = $('#mon-in'); if (i && i.showPicker){ try { i.showPicker(); } catch {} } },
  jkind: t => { S.jkind = t.dataset.k; render(); },
  'is-range': t => { S.isRange = t.dataset.v; render(); },
  open: t => openDetail(t.dataset.id),
  edit: t => { const e = entries().find(x => x.id === t.dataset.id); if (e){ closeSheet(); openEntry(e.kind, e); } },
  reverse: t => { const e = entries().find(x => x.id === t.dataset.id); if (e) reverseEntry(e); },
  del: t => { const e = entries().find(x => x.id === t.dataset.id); if (!e) return;
    dialog({title:'전표를 삭제할까요?', msg:`No. ${esc(e.no)} ‘${esc(e.memo)}’ 전표를 지워요. 기록을 남기려면 삭제 대신 역분개를 쓰세요.`, ok:'삭제', danger:true, onOk:() => { closeSheet(); deleteEntry(e); toast('전표를 삭제했어요'); }}); },
  fmode: t => { const m = t.dataset.m; if (m === F.mode) return;
    const lines = fLines();
    if (m === 'journal'){ const src = F.mode !== 'journal' && parseAmt(F.amt) ? lines : null; F.lines = src ? src.map(l => ({a:l.a, d:amtInputStr(l.d), c:amtInputStr(l.c)})) : F.lines.length ? F.lines : [{a:'',d:'',c:''},{a:'',d:'',c:''}]; }
    else { const def = quickDefaults(m); F.dr = def.dr; F.cr = def.cr; F.moreA = F.moreB = false; }
    F.mode = m; F.err = ''; if (!F.orig){ P.lastMode = m === 'journal' ? P.lastMode : m; savePrefs(); } setSheet(entryHTML()); },
  pick: t => { F[t.dataset.key] = t.dataset.code; F.err = ''; setSheet(entryHTML()); },
  more: t => { F['more' + t.dataset.k] = true; setSheet(entryHTML()); },
  'add-line': () => { F.lines.push({a:'', d:'', c:''}); setSheet(entryHTML()); },
  'rm-line': t => { if (F.lines.length <= 2) return; F.lines.splice(+t.dataset.i, 1); setSheet(entryHTML()); },
  save: () => saveEntry(),
  opening: () => openOpening(),
  'save-opening': () => saveOpening(),
  'acct-new': t => openAcct(null, t.dataset.type || 'X'),
  'acct-edit': t => openAcct(t.dataset.code),
  'acct-save': () => saveAcct(),
  'acct-del': t => { if (t.getAttribute('aria-disabled') === 'true') return; delAcct(); },
  'export-json': () => exportJSON(),
  'export-csv': () => exportCSV(),
  import: () => { if (S.mode === 'loading') return; $('#file-in').value = ''; $('#file-in').click(); },
  wipe: () => wipeAll(),
  install: () => doInstall(),
  'install-hide': () => { P.installHide = true; savePrefs(); render(); },
};
document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-act]'); if (!t) return;
  const fn = ACT[t.dataset.act]; if (!fn) return;
  if (t.tagName === 'BUTTON' || t.dataset.act === 'close' || t.dataset.act === 'dlg-no') ev.preventDefault();
  if (t.dataset.act === 'mon-pick') return fn(t, ev);
  fn(t, ev);
});
document.addEventListener('submit', ev => { ev.preventDefault(); if (F) saveEntry(); });
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.id === 'jq'){ S.jq = t.value; const l = $('#jlist'); if (l) l.innerHTML = jList(); return; }
  if (F){
    if (t.id === 'f-amt'){ liveFormat(t); F.amt = t.value; refreshEntryLive(); return; }
    if (t.id === 'f-memo'){ F.memo = t.value; return; }
    if (t.id === 'f-date'){ F.date = t.value; refreshEntryLive(); return; }
    const k = t.dataset.in;
    if (k === 'ld' || k === 'lc'){
      liveFormat(t); const i = +t.dataset.i; F.lines[i][k === 'ld' ? 'd' : 'c'] = t.value;
      const other = $(`#l-${k === 'ld' ? 'c' : 'd'}-${i}`); if (t.value && other && other.value){ other.value = ''; F.lines[i][k === 'ld' ? 'c' : 'd'] = ''; }
      const el = $(`#l-e-${i}`); if (el){ const l = F.lines[i]; const pl = {a:l.a, d:parseAmt(l.d), c:parseAmt(l.c)}; if (l.a) el.textContent = (pl.d > 0) !== (pl.c > 0) ? `${TYPES[typeOf(l.a)].name} · ${elementOf(pl)}` : `${TYPES[typeOf(l.a)].name} · 정상잔액 ${TYPES[typeOf(l.a)].side === 'D' ? '차변' : '대변'}`; }
      refreshEntryLive(); return;
    }
  }
  if (O && t.dataset.in === 'ov'){ liveFormat(t); O.vals[t.dataset.code] = t.value; const tt = $('#o-tot'); if (tt) tt.innerHTML = openingTot(); return; }
  if (t.dataset.in === 'money') liveFormat(t);
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.id === 'mon-in' && /^\d{4}-\d{2}$/.test(t.value)){ S.month = t.value; render(); return; }
  if (F && t.dataset.in === 'la'){ F.lines[+t.dataset.i].a = t.value; setSheet(entryHTML()); return; }
  if (t.dataset.in === 'aetype'){ const code = $('#ae-code'); const nt = t.value; AE.type = nt; const name = $('#ae-name').value; openAcct(null, nt); const n2 = $('#ae-name'); if (n2) n2.value = name; return; }
  if (t.id === 'cfg-cur'){ const v = t.value; if (!CUR[v] || S.mode !== 'live') return;
    dialog({title:'표시 통화를 바꿀까요?', msg:`금액은 환산되지 않고 표시 기호와 소수 자릿수만 ${esc(CUR[v].label)}(으)로 바뀌어요.`, ok:'바꾸기', onOk:() => { REAL.book = {...REAL.book, currency:v}; S.rev++; render(); Store.saveBook().catch(onStoreError); }});
    t.value = book().currency; return; }
  if (t.id === 'file-in' && t.files && t.files[0]) importFile(t.files[0]);
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape'){ if (!$('#dlg').hidden) closeDlg(); else if (!$('#sheet').hidden) closeSheet(); }
  if (ev.key === 'Enter' && F && ev.target.tagName === 'INPUT' && ev.target.type !== 'date'){ ev.preventDefault(); saveEntry(); }
});
// 차트 툴팁 (마우스·터치)
function chartFromEvent(ev){ const hit = ev.target.closest && ev.target.closest('.chart .hit'); if (!hit) return null; return {chart:hit.closest('.chart'), i:+hit.dataset.i}; }
document.addEventListener('pointermove', ev => { if (ev.pointerType === 'touch') return; const c = chartFromEvent(ev); if (c) showTip(c.chart, c.i); else document.querySelectorAll('.chart .tip.on').forEach(t => hideTip(t.closest('.chart'))); });
document.addEventListener('pointerdown', ev => { const c = chartFromEvent(ev); document.querySelectorAll('.chart .tip.on').forEach(t => { if (!c || t.closest('.chart') !== c.chart) hideTip(t.closest('.chart')); }); if (c) showTip(c.chart, c.i); });

/* ---------- 앱 설치 (안드로이드 Chrome) ---------- */
let INSTALL = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); INSTALL = e; if (S.mode !== 'loading') render(); });
window.addEventListener('appinstalled', () => { INSTALL = null; toast('홈 화면에 설치됐어요'); render(); });
function installBanner(){
  if (!INSTALL || P.installHide) return '';
  return `<div class="banner info"><div><b>휴대폰에 앱으로 설치</b>홈 화면 아이콘으로 바로 열리고 인터넷 없이도 써요.</div><button class="btn sm dark" data-act="install">설치</button><button class="x" data-act="install-hide" aria-label="설치 안내 닫기">✕</button></div>`;
}
async function doInstall(){
  if (!INSTALL) return;
  const ev = INSTALL;
  try { await ev.prompt(); await ev.userChoice; } catch {}
  INSTALL = null; render();
}

/* ---------- 라우팅 ---------- */
function route(){
  const h = (location.hash || '').replace(/^#/, '');
  S.acct = null;
  if (h === 'journal') S.view = 'journal';
  else if (h === 'ledger') S.view = 'ledger';
  else if (/^ledger-\d{4}$/.test(h)){ S.view = 'ledger'; S.acct = h.slice(7); }
  else if (h === 'balance' || h === 'income' || h === 'trial'){ S.view = 'reports'; S.rtab = ({balance:'bs', income:'is', trial:'tb'})[h]; }
  else if (h === 'config') S.view = 'config';
  else S.view = 'dashboard';
  if (!$('#sheet').hidden) closeSheet();
  render(); window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
let _rz = 0; window.addEventListener('resize', () => { clearTimeout(_rz); _rz = setTimeout(() => { if (S.view === 'dashboard') render(); }, 150); });

/* ---------- 시작 ---------- */
function startLocal(){
  Store.kind = 'local'; S.storage = 'local';
  const saved = lsGet(LS_BOOK);
  if (saved && saved.book){ REAL.book = normalizeBook(saved.book); REAL.months = {}; for (const mk in (saved.months || {})) REAL.months[mk] = cleanItems(saved.months[mk]); S.mode = 'live'; S.rev++; }
  else enterDemo();
  render();
}
function startCloud(db, id){
  Store.kind = 'cloud'; S.storage = 'cloud'; Store.db = db;
  Store.bookRef = db.doc(`data/users/${id}/book`);
  Store.col = Store.bookRef.collection('months');
  let bookKnown = false, monthsKnown = false;
  const timer = setTimeout(() => { if (S.mode === 'loading'){ S.note = 'slow'; render(); } }, 10000);
  const settle = () => { if (bookKnown && monthsKnown){ clearTimeout(timer); if (S.note === 'slow') S.note = ''; } };
  Store.bookRef.onSnapshot(snap => {
    if (snap.exists){ REAL.book = normalizeBook(clone(snap.data())); if (S.mode !== 'live'){ S.mode = 'live'; } S.rev++; }
    else if (!snap.metadata.fromCache){ REAL.book = null; if (S.mode !== 'demo') enterDemo(); }
    if (!snap.metadata.fromCache){ bookKnown = true; settle(); }
    render();
  }, err => { clearTimeout(timer); if (S.mode === 'loading'){ S.note = 'error'; } render(); if (err && err.code !== 'revoked') console.warn('book', err); });
  Store.col.onSnapshot(snap => {
    const months = {}; Store.cloudMonths = new Set();
    snap.docs.forEach(d => { Store.cloudMonths.add(d.id); const body = d.data(); months[d.id] = cleanItems(clone((body && body.items) || {})); });
    REAL.months = months; S.rev++;
    if (!snap.metadata.fromCache){ monthsKnown = true; settle(); }
    if (S.mode === 'live') render();
  }, err => { clearTimeout(timer); console.warn('months', err); toast('전표를 불러오지 못했어요. 페이지를 다시 열어 주세요.', 4000); });
}
async function boot(){
  render();
  if (!IN_CLAUDE){
    // 호스트가 늦게 붙는 경우를 대비해 페이지 로드 직후 한 번 더 확인
    await new Promise(r => document.readyState === 'complete' ? r() : window.addEventListener('load', r, {once:true}));
    await new Promise(r => setTimeout(r, 200));
    IN_CLAUDE = !!(window.claude && typeof window.claude.use === 'function');
  }
  if (IN_CLAUDE){
    let db = null, user = null, id = null;
    try { [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]); } catch {}
    if (db && user){ try { id = await user.id(); } catch {} }
    if (db && id) return startCloud(db, id);
  }
  startLocal();
  if (!IN_CLAUDE) setupPWA();
}
function setupPWA(){
  try {
    const add = (rel, href, extra={}) => { if (document.querySelector(`link[rel="${rel}"]`)) return; const l = document.createElement('link'); l.rel = rel; l.href = href; Object.assign(l, extra); document.head.appendChild(l); };
    add('manifest', 'manifest.webmanifest'); add('apple-touch-icon', 'apple-touch-icon.png'); add('icon', 'icon.svg', {type:'image/svg+xml'});
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
  } catch {}
}
route();
boot();
